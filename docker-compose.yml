services:
  home:
    image: nginx:alpine
    container_name: home
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]

  contact:
    image: node:22-alpine
    container_name: home-contact
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    env_file: .env
    volumes:
      - ./contact:/app:ro
    networks: [web]

networks:
  web:
    external: true
